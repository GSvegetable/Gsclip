<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808"><meta name="description" content="Gsclip UI Lab — 在平板上实时打磨 Gsclip 笔记体验。">
<title>Gsclip · UI Lab</title>
<style>
:root{color-scheme:dark;--bg:#080808;--line:#252525;--muted:#858585;--text:#f1f0ed;--gold:#d9a51c;--gold2:#f0bd39;--safe-b:env(safe-area-inset-bottom,0px);font-family:Inter,"SF Pro Display","Roboto","Noto Sans SC",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}button{color:inherit;cursor:pointer}
.app{height:100dvh;display:grid;grid-template-columns:minmax(300px,min(35vw,390px)) 1fr;background:var(--bg)}
.sidebar{min-width:0;height:100%;display:flex;flex-direction:column;border-right:1px solid var(--line);background:#090909;position:relative;z-index:2}
.side-head{padding:clamp(24px,4vh,42px) 28px 18px;display:flex;align-items:center;gap:14px}
.folder-icon{width:48px;height:48px;border-radius:13px;background:#343434;display:grid;place-items:center;font-size:23px;flex:none}
.folder-title{font-size:21px;font-weight:700}.count{font-size:13px;color:var(--muted);margin-top:3px}
.head-actions{margin-left:auto;display:flex;gap:12px;align-items:center}.icon-btn{width:38px;height:38px;display:grid;place-items:center;border:0;background:transparent;border-radius:12px;color:#ddd;transition:.18s}.icon-btn:active,.icon-btn:hover{background:#222;color:var(--gold2)}.icon-btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2}
.search-wrap{padding:0 24px 14px;display:none}.search-wrap.show{display:block}.search{width:100%;height:42px;border:1px solid #2c2c2c;border-radius:13px;background:#151515;color:var(--text);padding:0 14px;outline:none}.search:focus{border-color:#94701d}
.note-list{padding:8px 16px 120px;overflow:auto;flex:1;min-height:0}.note-item{padding:14px 15px;border-radius:15px;margin-bottom:7px;border:1px solid transparent;background:transparent;display:block;width:100%;text-align:left}.note-item.active{background:#1c1911;border-color:#554116}.note-item:active{background:#25211a}.note-name{font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note-preview{font-size:12px;color:#929292;margin-top:6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.note-time{font-size:11px;color:#666;margin-top:8px}
.empty-left{position:absolute;left:18px;right:18px;top:49%;transform:translateY(-50%);text-align:center;color:#777;pointer-events:none}.empty-glyph{width:60px;height:60px;margin:0 auto 22px;color:#d9a51c}.empty-glyph svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.empty-left p{font-size:15px;line-height:1.9;margin:0;font-weight:550}
.quick-actions{position:absolute;right:28px;bottom:calc(90px + var(--safe-b));display:flex;flex-direction:column;gap:18px}.quick{width:66px;height:66px;border-radius:50%;border:1px solid #a8750b;background:radial-gradient(circle at 35% 25%,#bd8110,#805100 78%);box-shadow:0 8px 26px #a66b183b,inset 0 1px 0 #ffffff2b;display:grid;place-items:center;transition:transform .15s,filter .15s}.quick:active{transform:scale(.94);filter:brightness(1.2)}.quick svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bottom-nav{height:78px;flex:none;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:var(--safe-b);background:#090909}.nav-item{border:0;background:transparent;color:#777;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px}.nav-item svg{width:23px;height:23px;fill:currentColor;stroke:currentColor}.nav-item.active{color:var(--gold2)}
.workspace{min-width:0;min-height:0;position:relative;display:flex;flex-direction:column;background:#080808}.workspace-top{height:62px;flex:none;display:flex;align-items:center;padding:0 30px;border-bottom:1px solid #151515;color:#8b8b8b}.crumb{font-size:12px;letter-spacing:.1em;text-transform:uppercase}.workspace-tools{margin-left:auto;display:flex;gap:10px}
.workspace-body{flex:1;min-height:0;display:grid;place-items:center;padding:40px}.welcome{text-align:center;max-width:380px;color:#888;animation:rise .35s ease}.welcome-mark{width:72px;height:72px;margin:0 auto 24px;color:var(--gold)}.welcome-mark svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.welcome h2{font-size:18px;color:#aaa;font-weight:600;margin:0 0 9px}.welcome p{font-size:13px;line-height:1.7;color:#666;margin:0}
.editor{width:min(760px,100%);height:100%;max-height:850px;display:flex;flex-direction:column;animation:rise .25s ease}.editor-head{display:flex;align-items:center;gap:12px;padding:5px 0 20px;border-bottom:1px solid #242424}.editor-title{flex:1;background:transparent;border:0;outline:0;color:#f2f0eb;font-size:26px;font-weight:700;min-width:0}.editor-title::placeholder,.editor-body::placeholder{color:#555}.action{border:1px solid #333;background:#171717;border-radius:11px;padding:9px 14px;color:#ddd;font-size:13px}.action.primary{background:var(--gold);border-color:var(--gold);color:#17120a;font-weight:700}.editor-body{flex:1;resize:none;background:transparent;border:0;outline:0;padding:24px 0;color:#ddd;font-size:16px;line-height:1.85}.editor-foot{border-top:1px solid #242424;padding:12px 0;color:#666;font-size:11px;display:flex;justify-content:space-between}
.toast{position:absolute;left:50%;bottom:28px;transform:translate(-50%,15px);padding:10px 15px;border-radius:12px;background:#262626;color:#eee;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-backdrop{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:10;padding:20px}.modal-backdrop.show{display:grid}.modal{width:min(420px,100%);padding:24px;border-radius:20px;border:1px solid #343434;background:#171717;box-shadow:0 20px 80px #0009}.modal h3{margin:0 0 8px}.modal p{font-size:13px;color:#999;line-height:1.7}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr)}.sidebar{border-right:0}.workspace{display:none}.app.editing .sidebar{display:none}.app.editing .workspace{display:flex}.workspace-top{height:52px;padding:0 18px}.workspace-body{padding:22px}.editor-title{font-size:22px}.quick-actions{bottom:calc(90px + var(--safe-b))}}
@media(min-width:761px) and (max-width:1050px){.app{grid-template-columns:minmax(280px,34%) 1fr}.side-head{padding-left:22px;padding-right:20px}.note-list{padding-left:12px;padding-right:12px}.quick-actions{right:20px}}
</style></head>
<body>
<div class="app" id="app"><aside class="sidebar">
<header class="side-head"><div class="folder-icon">🗒️</div><div><div class="folder-title">未分类 <span style="font-size:13px">▸</span></div><div class="count" id="count">0 篇笔记</div></div><div class="head-actions">
<button class="icon-btn" id="searchToggle" aria-label="搜索笔记"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7.2"/><path d="m16.2 16.2 5 5"/></svg></button>
<button class="icon-btn" id="menuBtn" aria-label="列表选项"><svg viewBox="0 0 24 24"><path d="M4 6h13M4 12h13M4 18h9"/><path d="m19 5 2 2-2 2"/></svg></button></div></header>
<div class="search-wrap" id="searchWrap"><input class="search" id="search" placeholder="搜索笔记标题或内容…"></div><div class="note-list" id="noteList"></div>
<div class="empty-left" id="emptyLeft"><div class="empty-glyph"><svg viewBox="0 0 64 64"><path d="M40 9H15a6 6 0 0 0-6 6v35a6 6 0 0 0 6 6h35a6 6 0 0 0 6-6V29"/><path d="m25 39 4-12L47 9a5 5 0 0 1 7 7L36 34z"/><path d="m25 39 11-5"/></svg></div><p>点击 <span style="color:#d9a51c">〽</span> 创建手写笔记<br>点击 <span style="font-size:20px">＋</span> 创建文本笔记</p></div>
<div class="quick-actions"><button class="quick" id="drawBtn" aria-label="创建手写笔记"><svg viewBox="0 0 24 24"><path d="m4 17 9-9 4 4-9 9H4z"/><path d="m14 7 2-2a2.1 2.1 0 0 1 3 3l-2 2"/></svg></button><button class="quick" id="newBtn" aria-label="创建文本笔记"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></button></div>
<nav class="bottom-nav"><button class="nav-item active"><svg viewBox="0 0 24 24"><path d="M5 3h14v18H5z"/><path d="M8 7h8M8 11h8M8 15h5" fill="none" stroke="#080808" stroke-width="1.5"/></svg><span>笔记</span></button><button class="nav-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m7 12 3 3 7-7" fill="none" stroke="#080808" stroke-width="2"/></svg><span>待办</span></button><button class="nav-item"><svg viewBox="0 0 24 24"><path d="M6 2h8l5 5v15H6z"/><path d="M14 2v6h6" fill="none" stroke="#080808" stroke-width="1.5"/></svg><span>文档</span></button><button class="nav-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 22a8 8 0 0 1 16 0"/></svg><span>我的</span></button></nav></aside>
<main class="workspace"><div class="workspace-top"><span class="crumb">GSCLIP / NOTES</span><div class="workspace-tools"><button class="icon-btn" id="previewInfo" aria-label="预览说明">ⓘ</button></div></div><section class="workspace-body" id="workspaceBody"><div class="welcome"><div class="welcome-mark"><svg viewBox="0 0 64 64"><path d="M40 9H15a6 6 0 0 0-6 6v35a6 6 0 0 0 6 6h35a6 6 0 0 0 6-6V29"/><path d="m25 39 4-12L47 9a5 5 0 0 1 7 7L36 34z"/></svg></div><h2>无笔记</h2><p>从左侧创建一条笔记，或选择已有笔记。<br>这里将成为你的专注编辑空间。</p></div></section><div class="toast" id="toast"></div></main></div>
<div class="modal-backdrop" id="modal"><div class="modal"><h3>Gsclip UI Lab</h3><p>这是独立的网页预览环境。当前操作只保存在这个浏览器中，不会修改正式 APP 的笔记数据。我们会先在这里确认布局、颜色和交互，再移植到 Android 原生版本。</p><div class="modal-actions"><button class="action primary" id="modalClose">知道了</button></div></div></div>
<script>
(function(){
const $=id=>document.getElementById(id),app=$("app"),list=$("noteList"),empty=$("emptyLeft"),count=$("count"),workspace=$("workspaceBody"),toast=$("toast");let notes=[],selected=null,timer;
try{notes=JSON.parse(localStorage.getItem("gsclip-ui-lab-notes")||"[]")}catch(e){}
const persist=()=>localStorage.setItem("gsclip-ui-lab-notes",JSON.stringify(notes));
const notify=s=>{toast.textContent=s;toast.classList.add("show");clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove("show"),1900)};
const safe=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const render=()=>{const q=$("search").value.trim().toLowerCase(),shown=notes.filter(n=>(n.title+" "+n.body).toLowerCase().includes(q));count.textContent=notes.length+" 篇笔记";empty.style.display=shown.length?"none":"block";list.innerHTML=shown.map(n=>'<button class="note-item '+(n.id===selected?"active":"")+'" data-id="'+safe(n.id)+'"><div class="note-name">'+safe(n.title||"无标题笔记")+'</div><div class="note-preview">'+safe(n.body||"暂无内容")+'</div><div class="note-time">'+new Date(n.updated).toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})+'</div></button>').join("");list.querySelectorAll("[data-id]").forEach(b=>b.addEventListener("click",()=>openNote(b.dataset.id)))};
const openEditor=note=>{selected=note.id;app.classList.add("editing");workspace.innerHTML='<div class="editor"><div class="editor-head"><input class="editor-title" id="editTitle" maxlength="80" placeholder="给这条笔记起个标题…" value="'+safe(note.title)+'"><button class="action" id="cancel">取消</button><button class="action primary" id="save">保存</button></div><textarea class="editor-body" id="editBody" placeholder="记录此刻的想法…">'+safe(note.body)+'</textarea><div class="editor-foot"><span>自动保存在本地预览</span><button class="action" id="delete">删除笔记</button></div></div>';$("save").onclick=()=>{note.title=$("editTitle").value.trim()||"无标题笔记";note.body=$("editBody").value;note.updated=Date.now();persist();closeEditor();notify("已保存")};$("cancel").onclick=closeEditor;$("delete").onclick=()=>{notes=notes.filter(n=>n.id!==note.id);persist();closeEditor();notify("笔记已删除")};$("editTitle").focus()};
const openNote=id=>{const n=notes.find(x=>x.id===id);if(n)openEditor(n)};
const closeEditor=()=>{selected=null;app.classList.remove("editing");workspace.innerHTML='<div class="welcome"><div class="welcome-mark"><svg viewBox="0 0 64 64"><path d="M40 9H15a6 6 0 0 0-6 6v35a6 6 0 0 0 6 6h35a6 6 0 0 0 6-6V29"/><path d="m25 39 4-12L47 9a5 5 0 0 1 7 7L36 34z"/></svg></div><h2>无笔记</h2><p>从左侧创建一条笔记，或选择已有笔记。<br>这里将成为你的专注编辑空间。</p></div>';render()};
const create=kind=>{const n={id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),title:kind==="draw"?"手写笔记":"",body:kind==="draw"?"手写画布预览即将加入。你可以先在这里记录想法。":"",updated:Date.now(),kind:kind};notes.unshift(n);persist();render();openEditor(n);if(kind==="draw")notify("已创建手写笔记预览")};
$("newBtn").onclick=()=>create("text");$("drawBtn").onclick=()=>create("draw");$("searchToggle").onclick=()=>{$("searchWrap").classList.toggle("show");if($("searchWrap").classList.contains("show"))$("search").focus();else{$("search").value="";render()}};$("search").oninput=render;$("menuBtn").onclick=()=>notify("列表排序与分类功能将在后续迭代加入");$("previewInfo").onclick=()=>$("modal").classList.add("show");$("modalClose").onclick=()=>$("modal").classList.remove("show");$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.remove("show")};document.querySelectorAll(".nav-item").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(b.textContent.trim()!=="笔记")notify("当前 UI 实验阶段先打磨笔记工作区")});render();
})();
</script></body></html>
